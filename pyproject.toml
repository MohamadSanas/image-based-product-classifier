[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "image-based-product-classifier"
version = "1.0.0"
description = "Smart Supermarket Product Identification System using Deep Learning"
readme = "README.md"
license = { text = "Educational Use Only" }
requires-python = ">=3.10"
authors = [{ name = "EC9570 Team", email = "team@example.com" }]
keywords = ["image-classification", "deep-learning", "computer-vision", "supermarket"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ----- pytest -----------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# ----- mypy (type checking) ---------------------------------
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false
warn_return_any = true
warn_unused_configs = true

# ----- ruff (linting + formatting) --------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]
