# ============================================================
# Smart Supermarket Product Classifier — Master Configuration
# ============================================================

project:
  name: "Smart Supermarket Product Classifier"
  version: "1.0.0"

# ----- Paths ------------------------------------------------
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_test: "data/test"
  model_weights: "models/weights/best.pt"
  model_checkpoints: "models/checkpoints"
  output_images: "output/detected_images"
  output_reports: "output/reports"
  output_charts: "output/charts"
  database: "output/scan_history.db"

# ----- Product Categories (RPC Dataset) ----------------------
categories:
  - "Puffed Food"
  - "Dried Fruit"
  - "Dried Food"
  - "Instant Drinks"
  - "Instant Noodles"
  - "Desserts"
  - "Soft Drinks & Beverages"
  - "Alcoholic Beverages"
  - "Milk & Dairy Products"
  - "Canned Food"
  - "Chocolate"
  - "Chewing Gum"
  - "Candy"
  - "Seasonings / Spices"
  - "Personal Hygiene Products"
  - "Tissue Products"
  - "Stationery"

# ----- Preprocessing ----------------------------------------
preprocessing:
  target_size: [640, 640]       # (height, width) — YOLO input size
  normalize: true               # Scale pixel values to [0, 1]
  denoise: true                 # Apply Gaussian blur
  denoise_kernel: [3, 3]
  histogram_equalization: false # Apply CLAHE if true

# ----- Segmentation / Product Isolation ---------------------
segmentation:
  method: "bounding_box_roi"    # Region of Interest isolation from bounding boxes
  padding: 8                   # Margin padding around bounding boxes (px)

# ----- Model Architecture -----------------------------------
model:
  architecture: "YOLOv8n"       # Ultralytics YOLOv8 nano
  weights: "models/weights/best.pt"
  num_classes: 200
  input_shape: [640, 640, 3]

# ----- Training ---------------------------------------------
training:
  epochs_phase1: 10             # Phase 1: frozen base
  epochs_phase2: 20             # Phase 2: fine-tune last layers
  batch_size: 32
  learning_rate_phase1: 0.001
  learning_rate_phase2: 0.0001
  unfreeze_from_layer: -30      # Unfreeze last N layers for phase 2
  validation_split: 0.2
  seed: 42
  augmentation:
    horizontal_flip: true
    rotation_range: 20
    zoom_range: 0.2
    brightness_range: [0.8, 1.2]

# ----- Classification (Inference) ---------------------------
inference:
  confidence_threshold: 0.6    # Minimum confidence to accept a prediction
  top_k: 3                     # Return top-k predictions per region

# ----- API --------------------------------------------------
api:
  host: "0.0.0.0"
  port: 8000
  debug: false
  max_upload_size_mb: 10
  allowed_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".webp"]

# ----- Visualization ----------------------------------------
visualization:
  bbox_color: [0, 255, 0]       # BGR: green bounding boxes
  bbox_thickness: 2
  font_scale: 0.7
  chart_dpi: 150
  chart_style: "seaborn-v0_8-darkgrid"
